    <!-- CSS -->
    <style>
      .sidebar {
        height: 100%; /* Full-height */
        width: 250px; /* Default width */
        position: fixed; /* Stay in place */
        z-index: 1; /* Stay on top */
        top: 0;
        left: 0;
        background-color: #111; /* Sidebar background */
        overflow-x: hidden; /* Disable horizontal scroll */
        transition: 0.5s; /* Transition effect when opening/closing */
        padding-top: 60px; /* Place content 60px from the top */
      }

      .footer-text {
        position: absolute;
        bottom: 50px; /* Adjust this if you want more/less space from the bottom */
        left: 50%;
        transform: translateX(-50%);
        color: rgb(255, 255, 255);
        font-size: 15px;
        text-align: center;
      }

      /* Style the open button */
      .openbtn {
        font-size: 20px;
        cursor: pointer;
        background-color: #111;
        color: white;
        border: none;
        padding: 10px 15px;
      }

      /* close btn */
      .closebtn {
        cursor: pointer;
      }

      /* When the sidebar is hidden */
      .sidebar.closed {
        width: 0;
        padding: 0;
      }
    </style>

    <!-- JavaScript -->
    <script>
      function toggleNav() {
        var sidebar = document.getElementById("mySidebar");
        var mainContent = document.getElementById("main");

        if (sidebar.classList.contains("closed")) {
          sidebar.classList.remove("closed");
          mainContent.style.marginLeft = "250px"; // Adjust to match sidebar width
        } else {
          sidebar.classList.add("closed");
          mainContent.style.marginLeft = "0";
        }
      }

      // Ensure the sidebar is closed on page load
      window.onload = function () {
        var sidebar = document.getElementById("mySidebar");
        var mainContent = document.getElementById("main");

        sidebar.classList.add("closed"); // Ensure the sidebar is closed by default
        mainContent.style.marginLeft = "0"; // Adjust the margin accordingly
      };

      function darkmode() {
        document.body.classList.toggle("dark-mode");
      }
    </script>

      function performSearch() {
        var input = document.getElementById("searchInput").value.toLowerCase();
        var searchResults = searchGames(input);
        redirectToSearchResults(searchResults);
      }

      function searchGames(input) {
        var searchResults = [];

        // Search for games that match the input
        for (var i = 0; i < games.length; i++) {
          var game = games[i].name.toLowerCase();
          if (game.includes(input)) {
            searchResults.push(games[i]);
          }
        }

        return searchResults;
      }

      function redirectToSearchResults(searchResults) {
        var searchResultsJson = JSON.stringify(searchResults);
        localStorage.setItem("searchResults", searchResultsJson);
        window.location.href = "search_results.html";
      }
