      function performSearch() {
        var input = document.getElementById("searchInput").value.toLowerCase();
        var searchResults = searchGames(input);
        redirectToSearchResults(searchResults);
      }

      function searchGames(input) {
        var searchResults = [];

        // Search for games that match the input
        for (var i = 0; i < games.length; i++) {
          var game = games[i].name.toLowerCase();
          if (game.includes(input)) {
            searchResults.push(games[i]);
          }
        }

        return searchResults;
      }

      function redirectToSearchResults(searchResults) {
        var searchResultsJson = JSON.stringify(searchResults);
        localStorage.setItem("searchResults", searchResultsJson);
        window.location.href = "search_results.html";
      }
